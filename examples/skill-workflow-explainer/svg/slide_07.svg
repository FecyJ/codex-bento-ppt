    <rect x="914" y="268" width="220" height="44" rx="12" fill="#111827" stroke="#fb923c"/><text x="936" y="296" font-family="Noto Sans CJK SC, WenQuanYi Micro Hei, Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#fed7aa">editable text</text>
    <rect x="914" y="334" width="220" height="44" rx="12" fill="#111827" stroke="#fbbf24"/><text x="936" y="362" font-family="Noto Sans CJK SC, WenQuanYi Micro Hei, Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#fef3c7">native shapes</text>
