    <rect x="510" y="306" width="236" height="50" rx="14" fill="#111827" stroke="#a78bfa"/>
    <text x="532" y="338" font-family="Noto Sans CJK SC, WenQuanYi Micro Hei, Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#e9d5ff">ppt_master_bridge.py</text>
    <rect x="510" y="380" width="236" height="50" rx="14" fill="#111827" stroke="#c4b5fd"/>
    <text x="532" y="412" font-family="Noto Sans CJK SC, WenQuanYi Micro Hei, Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#e9d5ff">assemble_pptx.py</text>
